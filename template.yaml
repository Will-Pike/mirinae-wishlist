AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless API and persistent storage for the Mirinae wishlist

Parameters:
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: New admin password (at least 16 characters)
  WebsiteCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:701592626401:certificate/f2a0b6dd-900c-4b1c-b80c-693758b14651
    Description: ACM certificate for wishlist.mirinae-pike.com in us-east-1

Resources:
  WishlistApi:
    Type: AWS::Serverless::HttpApi

  WishlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: server/
      Handler: lambda.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref WishlistTable
          ADMIN_PASSWORD: !Ref AdminPassword
          NODE_ENV: production
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WishlistTable
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref WishlistApi
            Path: /api/{proxy+}
            Method: ANY

  WishlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-website'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - wishlist.mirinae-pike.com
        ViewerCertificate:
          AcmCertificateArn: !Ref WebsiteCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        Origins:
          - Id: WebsiteOrigin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
          - Id: ApiOrigin
            DomainName: !Sub '${WishlistApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${WishlistApi}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Description: DynamoDB table storing wishlist state
    Value: !Ref WishlistTable
  WebsiteBucketName:
    Description: S3 bucket for the React build
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Description: HTTPS URL for the app
    Value: !Sub 'https://${WebsiteDistribution.DomainName}'
  WebsiteDistributionId:
    Description: CloudFront distribution ID for invalidations
    Value: !Ref WebsiteDistribution